[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dice-cli"
version = "0.1.0"
description = "CLI-утилита для бросков костей и статистики"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
dice = "dice_app.cli:cli"

[tool.setuptools.packages.find]
include = ["dice_app*"]

